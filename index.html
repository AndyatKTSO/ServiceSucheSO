<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Suche Kanton Solothurn</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        #results { margin-top: 20px; }
        .service-item { padding: 12px; border-bottom: 1px solid #eee; }
        .service-item a { text-decoration: none; color: #0066cc; font-weight: bold; }
        .service-item a:hover { text-decoration: underline; }
        .department { font-size: 12px; color: #666; margin-top: 4px; }
        .status { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h2>Services Kanton Solothurn durchsuchen</h2>
    <!-- Das Suchfeld -->
    <input type="text" id="search-input" placeholder="Suchbegriff eingeben (z.B. MFK, Steuern)..." autocomplete="off">

    <!-- Hier werden die Ergebnisse reingeschrieben -->
    <div id="results"></div>

    <script>
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results');
        let timeoutId;

        // Event-Listener: Reagiert auf jede Tastatureingabe
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();

            // Suchfeld leeren -> Ergebnisse löschen
            if (query.length === 0) {
                resultsContainer.innerHTML = '';
                return;
            }

            // Debounce: Wartet 300ms nach dem letzten Tastendruck, 
            // damit nicht bei jedem einzelnen Buchstaben eine API-Anfrage gesendet wird.
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                executesearch(query);
            }, 3000);
        });

        async function executesearch(query) {
            resultsContainer.innerHTML = '<p class="status">Suche läuft...</p>';

            try {
                // API des Kantons Solothurn abfragen
                const response = await fetch(`https://so.ch{encodeURIComponent(query)}`);
                const data = await response.json();

                // Container leeren
                resultsContainer.innerHTML = '';

                // Falls keine Services gefunden wurden
                if (!data.results || data.results.length === 0) {
                    resultsContainer.innerHTML = '<p class="status">Keine passenden Services gefunden.</p>';
                    return;
                }

                // Ergebnisse durchlaufen und HTML generieren
                data.results.forEach(service => {
                    const item = document.createElement('div');
                    item.className = 'service-item';
                    
                    // Wichtig: Die Links in der API sind relativ (/services/...), 
                    // wir hängen die Hauptdomain davor.
                    item.innerHTML = `
                        <a href="https://so.ch${service.url}" target="_blank">${service.title}</a>
                        <div class="department">${service.department || 'Allgemeiner Dienst'}</div>
                    `;
                    resultsContainer.appendChild(item);
                });

            } catch (error) {
                console.error('Fehler bei der API-Abfrage:', error);
                resultsContainer.innerHTML = '<p class="status" style="color:red;">Fehler beim Laden der Live-Daten.</p>';
            }
        }
    </script>

</body>
</html>
