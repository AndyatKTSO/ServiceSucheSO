<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Suche Kanton Solothurn</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        #results { margin-top: 20px; }
        .service-item { padding: 12px; border-bottom: 1px solid #eee; }
        .service-item a { text-decoration: none; color: #0066cc; font-weight: bold; }
        .service-item a:hover { text-decoration: underline; }
        .department { font-size: 12px; color: #666; margin-top: 4px; }
        .status { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h2>Services Kanton Solothurn durchsuchen</h2>
    <input type="text" id="search-input" placeholder="Suchbegriff eingeben (z.B. gefahrgut, MFK)..." autocomplete="off">
    <div id="results"></div>

    <script>
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results');
        let timeoutId;

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();

            if (query.length === 0) {
                resultsContainer.innerHTML = '';
                return;
            }

            clearTimeout(timeoutId);
            // 300ms warten, um die API nicht bei jedem Tastendruck zu überlasten
            timeoutId = setTimeout(() => {
                executesearch(query);
            }, 300);
        });

        async function executesearch(query) {
            resultsContainer.innerHTML = '<p class="status">Suche läuft...</p>';

            try {
                // Wir holen per Proxy die komplette Liste (Limit 500), um CORS zu umgehen und flexibel zu filtern
                const targetUrl = `https://so.ch`;
                const proxyUrl = `https://corsproxy.io{encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    resultsContainer.innerHTML = '<p class="status">Verbindung zur API fehlgeschlagen.</p>';
                    return;
                }

                const data = await response.json();
                resultsContainer.innerHTML = '';

                // Falls die Struktur nicht stimmt
                if (!data || !data.results || !Array.isArray(data.results)) {
                    resultsContainer.innerHTML = '<p class="status">Fehlerhafte Datenstruktur erhalten.</p>';
                    return;
                }

                // Hier filtern wir JETZT selbst im Browser nach dem Wortteil (z.B. "gefahrgut" oder "gefahr")
                const lowerQuery = query.toLowerCase();
                const filteredResults = data.results.filter(service => {
                    const titleMatch = service.title && service.title.toLowerCase().includes(lowerQuery);
                    const deptMatch = service.department && service.department.toLowerCase().includes(lowerQuery);
                    return titleMatch || deptMatch;
                });

                // Falls nach dem Filtern nichts übrig bleibt
                if (filteredResults.length === 0) {
                    resultsContainer.innerHTML = '<p class="status">Keine passenden Services im Verzeichnis gefunden.</p>';
                    return;
                }

                // Ergebnisse rendern
                filteredResults.forEach(service => {
                    const item = document.createElement('div');
                    item.className = 'service-item';
                    item.innerHTML = `
                        <a href="https://so.ch${service.url}" target="_blank">${service.title}</a>
                        <div class="department">${service.department || 'Allgemeiner Dienst'}</div>
                    `;
                    resultsContainer.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = '<p class="status">Fehler beim Laden der Live-Daten.</p>';
            }
        }
    </script>

</body>
</html>
